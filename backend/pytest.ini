[pytest]
testpaths = tests

# The e2e suite hits the real database, the real checkpointer, and a paid LLM.
# It is excluded from the default run so `pytest` stays a fast, free, offline
# check — run it explicitly with `pytest tests/e2e` when you mean to.
addopts = --ignore=tests/e2e

markers =
    e2e: end-to-end test against live services (database, checkpointer, LLM)
